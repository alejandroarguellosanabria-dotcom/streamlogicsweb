<style>
:root {
  --bg:     #e8f4f2;
  --white:  #ffffff;
  --p1:     #c2deda;
  --p2:     #9ecdc8;
  --p3:     #12A183;   /* verde Streamlogics — el de la marca */
  --p4:     #d8eeed;
  --dark:   #0f2e2b;
  --mid:    #1e5c56;
  --muted:  #5a8c87;
  --border: #b0d4cf;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
body {
  background:var(--bg);
  color:var(--dark);
  font-family:'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight:300;
  overflow-x:hidden;
  line-height:1.5;
}

/* ═══ DONDE PARAN LOS ENLACES INTERNOS ═══ */
/* La barra de arriba es fija y tapa 64px. Sin esto, pulsar "Quiero un clip
   gratis" deja el primer campo del formulario debajo de la barra: se ve el
   recuadro a medias y la etiqueta no se ve. El que llega a pedir su clip
   aterriza en algo cortado.

   scroll-margin-top hace que el ancla pare mas abajo, y lo respetan las tres
   formas de llegar: el clic (scrollIntoView), la tecla, y abrir la URL con
   #free directamente. Por eso va en CSS y no en el JavaScript del clic. */
#problem, #how, #free, #pricing, #process, #faq, #contacto {
  scroll-margin-top: 88px;   /* 64 de barra + aire */
}

/* ═══ EL PASO ANTES DE PAGAR ═══ */
/* Aparece sobre la pagina al pulsar cualquier boton de compra. No es un
   adorno legal: es el unico momento en que el cliente puede aceptar algo
   ANTES de que le cobren. */
.mp-fondo {
  position:fixed; inset:0; z-index:900; display:none;
  background:rgba(15,46,43,.55); backdrop-filter:blur(3px);
  align-items:center; justify-content:center; padding:20px;
}
.mp-fondo.abierto { display:flex; }
.mp {
  background:var(--white); border-radius:16px; max-width:460px; width:100%;
  padding:clamp(22px,4vw,32px); box-shadow:0 24px 60px rgba(15,46,43,.28);
  max-height:92vh; overflow-y:auto;
}
.mp h3 {
  font-family:'Playfair Display',Georgia,serif; font-weight:700;
  font-size:clamp(1.25rem,3.5vw,1.5rem); line-height:1.2; margin-bottom:8px;
}
.mp .mp-lead { color:var(--muted); font-size:.92rem; margin-bottom:18px; }
.mp-plan {
  display:flex; align-items:baseline; justify-content:space-between;
  gap:12px; padding:13px 16px; margin-bottom:18px;
  background:var(--p4); border:1px solid var(--border); border-radius:10px;
}
.mp-plan b { font-size:1.05rem; font-weight:600; }
.mp-plan span { font-size:1.15rem; font-weight:600; color:var(--p3); }
.mp-chk {
  display:flex; align-items:flex-start; gap:11px; cursor:pointer;
  font-size:.87rem; line-height:1.55; margin-bottom:20px; color:var(--dark);
}
.mp-chk input {
  margin-top:.22em; width:17px; height:17px; flex:0 0 auto;
  cursor:pointer; accent-color:var(--p3);
}
.mp-chk a { color:var(--p3); text-decoration:underline; }
.mp-ir {
  display:block; text-align:center; text-decoration:none;
  background:var(--p3); color:var(--white); font-weight:600; font-size:.98rem;
  padding:14px 20px; border-radius:10px; transition:opacity .15s;
}
.mp-ir[aria-disabled="true"] { opacity:.4; pointer-events:none; }
.mp-no {
  display:block; width:100%; margin-top:12px; background:none; border:none;
  color:var(--muted); font-family:inherit; font-size:.87rem; cursor:pointer;
  padding:6px; text-decoration:underline;
}
.mp-no:hover { color:var(--dark); }

/* ═══ NAV ═══ */
nav {
  position:fixed; top:0; left:0; right:0; z-index:100;
  background:var(--white);
  border-bottom:1px solid var(--border);
  height:64px;
  display:flex; align-items:center;
  justify-content:space-between;
  padding:0 5%;
}
.logo {
  font-family:'Playfair Display', Georgia, serif;
  font-size:1.25rem; font-weight:400; color:var(--dark);
  letter-spacing:0.5px;
  display:flex; align-items:center; gap:10px;
}
.logo img { height:28px; width:auto; display:block; }
.nav-links { display:flex; align-items:center; gap:0; }
.nav-links a {
  padding:0 20px; height:64px;
  display:flex; align-items:center;
  color:var(--muted); text-decoration:none;
  font-size:0.88rem; font-weight:400;
  border-left:1px solid var(--border);
  transition:all 0.2s;
  white-space:nowrap;
}
.nav-links a:hover { background:var(--p4); color:var(--dark); }
.nav-links .nav-cta { background:var(--dark); color:var(--white) !important; font-weight:600; }
.nav-links .nav-cta:hover { background:var(--mid) !important; }
.lang-pick {
  display:flex; align-items:center; height:64px;
  border-left:1px solid var(--border);
}
.lang-pick button {
  background:none; border:none; cursor:pointer;
  font-family:'Outfit',sans-serif; font-size:0.78rem; font-weight:500;
  letter-spacing:1px; color:var(--muted);
  padding:0 11px; height:64px; transition:.18s;
}
.lang-pick button:hover { color:var(--dark); }
.lang-pick button.on { color:var(--p3); font-weight:600; }
/* En escritorio el selector vive dentro del menu; el de fuera es el de movil,
   donde el menu se esconde. Si no, se ven los dos a la vez. */
.lang-pick.solo-movil { display:none; }
.nav-mobile-cta {
  display:none;
  background:var(--dark); color:var(--white);
  padding:10px 20px; font-size:0.88rem; font-weight:600;
  text-decoration:none; font-family:'Outfit',sans-serif;
  white-space:nowrap;
}

/* ═══ HERO ═══ */
.hero {
  min-height:100svh;
  padding:100px 5% 60px;
  background:var(--bg);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  text-align:center;
}
.hero-badge {
  display:inline-flex; align-items:center; gap:8px;
  background:rgba(255,255,255,0.8);
  border:1px solid var(--border);
  padding:8px 18px; margin-bottom:36px;
  font-size:0.72rem; font-weight:600;
  letter-spacing:2.5px; text-transform:uppercase;
  color:var(--mid);
}
.badge-dot { width:6px; height:6px; border-radius:50%; background:var(--p3); animation:blink 2s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

h1 {
  font-family:'Playfair Display', Georgia, serif;
  font-size:clamp(2.8rem, 8vw, 7rem);
  font-weight:700; line-height:1.08;
  color:var(--dark); margin-bottom:24px;
  max-width:800px; letter-spacing:-0.5px;
}
h1 em { font-style:italic; color:var(--p3); }

.hero-sub {
  font-size:clamp(1rem, 2.5vw, 1.35rem);
  color:var(--muted); line-height:1.85;
  max-width:520px; margin:0 auto 40px;
}
.hero-btns {
  display:flex; align-items:stretch; justify-content:center;
  gap:12px; flex-wrap:wrap; margin-bottom:14px;
  width:100%; max-width:640px;
}
/* Los dos exactamente iguales: mismo color, mismo alto y mismo ancho.
   El flex:1 1 0 es lo que iguala el ancho aunque el texto de uno sea mas
   largo que el del otro. */
.hero-btn, .hero-btn2 {
  flex:1 1 0; min-width:0;
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--dark); color:var(--white);
  padding:clamp(16px,3vw,22px) clamp(18px,3vw,30px);
  font-size:clamp(1rem,2.5vw,1.3rem);
  font-weight:600; text-decoration:none;
  font-family:'Outfit',sans-serif;
  transition:background 0.25s;
  text-align:center;
}
.hero-btn:hover, .hero-btn2:hover { background:var(--mid); }
.hero-second {
  font-size:0.9rem; color:var(--muted); margin-bottom:52px;
}
.hero-second a { color:var(--mid); font-weight:500; }

.hero-stats {
  width:100%; max-width:900px;
  display:grid; grid-template-columns:repeat(3,1fr);
  border:1px solid var(--border);
  background:var(--white);
}
.hstat {
  padding:clamp(20px,3vw,32px) clamp(16px,3vw,36px);
  border-right:1px solid var(--border);
  text-align:left;
  transition:background 0.2s;
}
.hstat:last-child { border-right:none; }
.hstat:hover { background:var(--p4); }
.hstat-label {
  font-size:0.68rem; font-weight:600; letter-spacing:2px;
  text-transform:uppercase; color:var(--p3); margin-bottom:6px;
}
.hstat-num {
  font-family:'Playfair Display',Georgia,serif;
  font-size:clamp(1.6rem,3vw,2.6rem);
  font-weight:900; color:var(--dark); line-height:1;
  margin-bottom:6px;
}
.hstat-desc { font-size:clamp(0.72rem,1.2vw,0.85rem); color:var(--muted); line-height:1.4; }

/* ═══ STRIP ═══ */
.strip { background:var(--dark); overflow:hidden; padding:0; border-top:1px solid rgba(255,255,255,0.06); }
.strip-track { display:flex; width:max-content; animation:marquee 24s linear infinite; }
@keyframes marquee { from{transform:translateX(0)} to{transform:translateX(-50%)} }
.strip-item {
  padding:14px 40px;
  font-size:0.78rem; font-weight:500;
  letter-spacing:2px; text-transform:uppercase;
  color:var(--p2); white-space:nowrap;
  border-right:1px solid rgba(255,255,255,0.08);
  display:flex; align-items:center; gap:14px;
}
.sdot { width:4px; height:4px; background:var(--p3); border-radius:50%; flex-shrink:0; }

/* ═══ SECTIONS ═══ */
.section { padding:clamp(44px,5vw,80px) 5%; }
.sec-header {
  display:grid; grid-template-columns:1fr 1fr;
  gap:clamp(24px,5vw,60px); align-items:end;
  padding-bottom:clamp(20px,3vw,32px);
  margin-bottom:clamp(20px,3vw,32px);
  border-bottom:1px solid var(--border);
}
.sec-label { font-size:0.7rem; font-weight:600; letter-spacing:3px; text-transform:uppercase; color:var(--p3); margin-bottom:14px; }
h2 { font-family:'Playfair Display',Georgia,serif; font-size:clamp(2rem,5vw,4.5rem); font-weight:700; line-height:1.05; color:var(--dark); }
.sec-sub { font-size:clamp(0.95rem,1.8vw,1.15rem); color:var(--muted); line-height:1.85; align-self:end; }

/* ═══ PAIN ═══ */
.pain-bg { background:var(--white); }
.pain-intro-box { background:var(--bg); border:1px solid var(--border); padding:clamp(20px,3vw,32px) clamp(20px,3vw,36px); margin-bottom:clamp(16px,2vw,24px); }
.pain-intro-box p { font-size:clamp(1rem,2vw,1.2rem); color:var(--muted); line-height:1.9; margin-bottom:16px; }
.pain-intro-box p:last-child { margin-bottom:0; }
.pain-highlight { background:var(--p1); border-left:4px solid var(--p3); padding:18px 24px; font-size:clamp(1rem,1.8vw,1.15rem); font-weight:500; color:var(--dark); line-height:1.65; margin:16px 0; }
.pain-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:0; border:1px solid var(--border); }
.pain-card { padding:clamp(24px,3vw,36px) clamp(20px,3vw,32px); border-right:1px solid var(--border); background:var(--white); transition:background 0.3s; }
.pain-card:last-child { border-right:none; }
.pain-card:hover { background:var(--p4); }
.pain-card-title { font-family:'Playfair Display',Georgia,serif; font-size:clamp(1.05rem,1.8vw,1.2rem); font-weight:600; color:var(--dark); margin-bottom:10px; }
.pain-card p { font-size:clamp(0.88rem,1.5vw,1rem); color:var(--muted); line-height:1.75; }

/* ═══ DEMO: COMO SE CONSTRUYE UN CLIP ═══ */
.demo-bg { background:var(--bg); }
.demo-flow {
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:clamp(14px,2vw,22px);
  margin-bottom:clamp(28px,4vw,44px);
}
.demo-step { background:var(--white); border:1px solid var(--border); display:flex; flex-direction:column; }
.demo-visual {
  position:relative; overflow:hidden; background:var(--dark);
  height:clamp(190px,17vw,240px);
}
.demo-visual.tall { display:grid; place-items:center; background:#0a1a18; }
/* El clip vertical se muestra dentro del mismo alto que los otros dos.
   Asi la fila queda pareja y ademas se ve la forma real de un 9:16. */
.demo-phone { position:relative; height:100%; aspect-ratio:9/16; overflow:hidden; }
.demo-scene {
  position:absolute; inset:0;
  background:linear-gradient(150deg,#123b36 0%,#1e5c56 45%,#2b7f6f 100%);
}
.demo-scene::before {
  content:''; position:absolute; inset:0;
  background:radial-gradient(circle at 32% 38%, rgba(255,255,255,0.20) 0%, transparent 42%);
}
.demo-person {
  position:absolute; left:50%; top:52%; transform:translate(-50%,-50%);
  width:26%; aspect-ratio:3/4;
  background:rgba(255,255,255,0.30); border-radius:44% 44% 30% 30%;
}
.demo-phone .demo-person { width:54%; top:43%; }
.demo-crop {
  position:absolute; top:6%; bottom:6%; left:50%; transform:translateX(-50%);
  aspect-ratio:9/16;
  border:2.5px solid var(--p3);
  box-shadow:0 0 0 9999px rgba(15,46,43,0.55);
  border-radius:3px;
}
.demo-wave { position:absolute; left:0; right:0; bottom:0; height:34%; display:flex; align-items:flex-end; gap:2px; padding:0 8px 8px; }
.demo-wave i { flex:1; background:rgba(255,255,255,0.30); border-radius:2px 2px 0 0; }
.demo-wave i.hot { background:var(--p3); }
.demo-caption {
  position:absolute; left:6%; right:6%; bottom:13%;
  text-align:center; font-family:'Outfit',sans-serif;
  font-weight:600; font-size:clamp(0.7rem,1.5vw,0.95rem);
  color:#fff; text-transform:uppercase; letter-spacing:0.5px;
  text-shadow:0 2px 10px rgba(0,0,0,0.75); line-height:1.25;
}
.demo-caption b { color:#FFD84D; font-weight:600; }
.demo-tag {
  position:absolute; top:9px; left:9px;
  background:rgba(0,0,0,0.55); color:#fff;
  font-size:0.6rem; font-weight:600; letter-spacing:1.6px;
  text-transform:uppercase; padding:4px 8px;
}
.demo-txt { padding:clamp(16px,2vw,22px); border-top:1px solid var(--border); }
.demo-n { font-size:0.68rem; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:var(--p3); margin-bottom:7px; }
.demo-txt h3 { font-family:'Playfair Display',Georgia,serif; font-size:clamp(1rem,1.8vw,1.2rem); font-weight:600; color:var(--dark); margin-bottom:7px; }
.demo-txt p { font-size:clamp(0.85rem,1.4vw,0.95rem); color:var(--muted); line-height:1.7; }

/* Solicitud del asesor de edicion personal: misma idea que la muestra gratis.
   Si hay Formulario de Google configurado se guarda ahi; si no (o si falla),
   se abre el correo del cliente con todo escrito. */
(function(){
  const form = document.getElementById('advForm');
  if (!form) return;
  const ok = document.getElementById('advOk'), err = document.getElementById('aErr'),
        btn = document.getElementById('aBtn');
  const f = { nombre:'aName', correo:'aMail', canal:'aChan', mensaje:'aMsg' };
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const val = {};
    for (const k in f) val[k] = document.getElementById(f[k]).value.trim();
    const bad = { nombre: !val.nombre, correo: !/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(val.correo), mensaje: !val.mensaje };
    for (const k in bad) document.getElementById(f[k]).classList.toggle('err', bad[k]);
    if (bad.nombre || bad.correo || bad.mensaje) { err.textContent = TX[L].eAdv; return; }
    err.textContent = '';
    btn.disabled = true; btn.textContent = TX[L].sending;

    const A = SL.asesor;
    let guardado = false;
    if (A && A.formAction && A.campos.correo) {
      const datos = new FormData();
      for (const k in A.campos) if (A.campos[k]) datos.append(A.campos[k], k === 'mensaje' ? val[k] + ' [' + L + ']' : val[k]);
      try { await fetch(A.formAction, {method:'POST', mode:'no-cors', body:datos}); guardado = true; }
      catch (er) { guardado = false; }
    }
    if (!guardado) {
      const cuerpo = encodeURIComponent('Name: ' + val.nombre + '\nEmail: ' + val.correo +
        '\nChannel: ' + val.canal + '\nLanguage: ' + L + '\n\n' + val.mensaje);
      window.location.href = 'mailto:' + SL.email + '?subject=' +
        encodeURIComponent('Personal editing advisor request') + '&body=' + cuerpo;
    }
    form.style.display = 'none';
    ok.style.display = 'block';
  });
})();
</script>
<script>
/* ==========================================================================
   EL PASO ANTES DE PAGAR
   --------------------------------------------------------------------------
   El precio y el nombre del plan NO se escriben aqui: se leen del propio
   boton que se acaba de pulsar. Asi, el dia que cambien los precios en la
   pagina, este recuadro cambia solo. Un precio duplicado a mano es un precio
   que tarde o temprano dice una cosa arriba y otra abajo.
   ========================================================================== */
(function(){
  const fondo  = document.getElementById("mpFondo");
  const chk    = document.getElementById("mpAcepto");
  const ir     = document.getElementById("mpIr");
  const nPlan  = document.getElementById("mpPlan");
  const nPre   = document.getElementById("mpPrecio");
  if (!fondo) return;

  let quienAbrio = null;

  function datosDe(a){
    // Tarjeta de precios: el nombre y el precio estan en la tarjeta.
    const oferta = a.closest(".offer");
    if (oferta) return {
      n: (oferta.querySelector(".offer-name") || {}).textContent || "",
      p: (oferta.querySelector(".offer-price") || {}).textContent || ""
    };
    const card = a.closest(".card");
    if (card) return {
      n: (card.querySelector(".card-name") || {}).textContent || "",
      p: (card.querySelector(".card-price, .price") || {}).textContent || ""
    };
    // Bloque compacto: van dentro del propio enlace.
    return {
      n: (a.querySelector(".pkg-name") || {}).textContent || "",
      p: (a.querySelector(".pkg-price") || {}).textContent || ""
    };
  }

  function abrir(a){
    const d = datosDe(a);
    nPlan.textContent = (d.n || "").trim() || "—";
    nPre.textContent  = (d.p || "").trim().split(/\s/)[0] || "";
    ir.href = a.href;
    chk.checked = false;
    ir.setAttribute("aria-disabled", "true");
    fondo.classList.add("abierto");
    document.body.style.overflow = "hidden";
    quienAbrio = a;
    setTimeout(()=>chk.focus(), 60);
  }

  function cerrar(){
    fondo.classList.remove("abierto");
    document.body.style.overflow = "";
    if (quienAbrio) { quienAbrio.focus(); quienAbrio = null; }
  }

  // Los enlaces conservan su href. Si este script no llega a ejecutarse,
  // el boton sigue llevando a Stripe como siempre.
  document.querySelectorAll('a[href^="https://buy.stripe.com"]').forEach(a=>{
    a.addEventListener("click", ev=>{
      // Ctrl/cmd-clic o rueda: que abra en pestana como cualquier enlace.
      if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button !== 0) return;
      ev.preventDefault();
      abrir(a);
    });
  });

  chk.addEventListener("change", ()=>
    ir.setAttribute("aria-disabled", chk.checked ? "false" : "true"));

  // Al continuar se cierra, para que quien vuelva atras no se encuentre el
  // recuadro abierto con la casilla ya marcada de la vez anterior.
  ir.addEventListener("click", ()=>{ if (chk.checked) setTimeout(cerrar, 120); });

  document.getElementById("mpNo").addEventListener("click", cerrar);
  fondo.addEventListener("click", ev=>{ if (ev.target === fondo) cerrar(); });
  document.addEventListener("keydown", ev=>{
    if (ev.key === "Escape" && fondo.classList.contains("abierto")) cerrar();
  });
})();
</script>
