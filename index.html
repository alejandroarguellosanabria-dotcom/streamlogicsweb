<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streamlogics — Clip Agency for Streamers</title>

<!-- ICONO DE LA PESTAÑA -->
<link rel="icon" type="image/png" href="streamlogics-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #e8f4f2;
  --white:  #ffffff;
  --p1:     #c2deda;
  --p2:     #9ecdc8;
  --p3:     #6ab0a8;
  --p4:     #d8eeed;
  --dark:   #0f2e2b;
  --mid:    #1e5c56;
  --muted:  #5a8c87;
  --border: #b0d4cf;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
body {
  background:var(--bg);
  color:var(--dark);
  font-family:'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight:300;
  overflow-x:hidden;
  line-height:1.5;
}

/* ═══ NAV ═══ */
nav {
  position:fixed; top:0; left:0; right:0; z-index:100;
  background:var(--white);
  border-bottom:1px solid var(--border);
  height:64px;
  display:flex; align-items:center;
  justify-content:space-between;
  padding:0 5%;
}
.logo {
  font-family:'Playfair Display', Georgia, serif;
  font-size:1.25rem; font-weight:400; color:var(--dark);
  letter-spacing:0.5px;
}
.nav-links {
  display:flex; align-items:center; gap:0;
}
.nav-links a {
  padding:0 20px; height:64px;
  display:flex; align-items:center;
  color:var(--muted); text-decoration:none;
  font-size:0.88rem; font-weight:400;
  border-left:1px solid var(--border);
  transition:all 0.2s;
  white-space:nowrap;
}
.nav-links a:hover { background:var(--p4); color:var(--dark); }
.nav-links .nav-cta {
  background:var(--dark); color:var(--white) !important;
  font-weight:600;
}
.nav-links .nav-cta:hover { background:var(--mid) !important; }
.nav-mobile-cta {
  display:none;
  background:var(--dark); color:var(--white);
  padding:10px 20px; font-size:0.88rem; font-weight:600;
  text-decoration:none; font-family:'Outfit',sans-serif;
  white-space:nowrap;
}

/* ═══ HERO ═══ */
.hero {
  min-height:100svh;
  padding:100px 5% 60px;
  background:var(--bg);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  text-align:center;
}

.hero-badge {
  display:inline-flex; align-items:center; gap:8px;
  background:rgba(255,255,255,0.8);
  border:1px solid var(--border);
  padding:8px 18px; margin-bottom:36px;
  font-size:0.72rem; font-weight:600;
  letter-spacing:2.5px; text-transform:uppercase;
  color:var(--mid);
}
.badge-dot {
  width:6px; height:6px; border-radius:50%;
  background:var(--p3);
  animation:blink 2s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

h1 {
  font-family:'Playfair Display', Georgia, serif;
  font-size:clamp(2.8rem, 8vw, 7rem);
  font-weight:700; line-height:1.08;
  color:var(--dark); margin-bottom:24px;
  max-width:800px; letter-spacing:-0.5px;
}
h1 em { font-style:italic; color:var(--p3); }

.hero-sub {
  font-size:clamp(1rem, 2.5vw, 1.35rem);
  color:var(--muted); line-height:1.85;
  max-width:520px; margin:0 auto 40px;
}

.hero-btn {
  display:inline-block;
  background:var(--dark); color:var(--white);
  padding:clamp(16px,3vw,22px) clamp(36px,6vw,64px);
  font-size:clamp(1rem,2.5vw,1.3rem);
  font-weight:600; text-decoration:none;
  font-family:'Outfit',sans-serif;
  transition:background 0.25s;
  margin-bottom:32px;
}
.hero-btn:hover { background:var(--mid); }

.proof {
  display:flex; align-items:center; gap:10px;
  justify-content:center;
  font-size:0.85rem; color:var(--muted);
  margin-bottom:52px;
}
.proof-avatars { display:flex; }
.proof-avatar {
  width:28px; height:28px; border-radius:50%;
  background:var(--p2); border:2px solid var(--bg);
  display:flex; align-items:center; justify-content:center;
  font-size:0.6rem; font-weight:600; color:var(--dark);
  margin-left:-7px;
}
.proof-avatar:first-child { margin-left:0; }

.hero-stats {
  width:100%; max-width:900px;
  display:grid; grid-template-columns:repeat(4,1fr);
  border:1px solid var(--border);
  background:var(--white);
}
.hstat {
  padding:clamp(20px,3vw,32px) clamp(16px,3vw,36px);
  border-right:1px solid var(--border);
  text-align:left;
  transition:background 0.2s;
}
.hstat:last-child { border-right:none; }
.hstat:hover { background:var(--p4); }
.hstat-label {
  font-size:0.68rem; font-weight:600; letter-spacing:2px;
  text-transform:uppercase; color:var(--p3); margin-bottom:6px;
}
.hstat-num {
  font-family:'Playfair Display',Georgia,serif;
  font-size:clamp(1.6rem,3vw,2.6rem);
  font-weight:900; color:var(--dark); line-height:1;
  margin-bottom:6px;
}
.hstat-desc { font-size:clamp(0.72rem,1.2vw,0.85rem); color:var(--muted); line-height:1.4; }

/* ═══ STRIP ═══ */
.strip {
  background:var(--dark); overflow:hidden;
  padding:0; border-top:1px solid rgba(255,255,255,0.06);
}
.strip-track {
  display:flex; width:max-content;
  animation:marquee 24s linear infinite;
}
@keyframes marquee { from{transform:translateX(0)} to{transform:translateX(-50%)} }
.strip-item {
  padding:14px 40px;
  font-size:0.78rem; font-weight:500;
  letter-spacing:2px; text-transform:uppercase;
  color:var(--p2); white-space:nowrap;
  border-right:1px solid rgba(255,255,255,0.08);
  display:flex; align-items:center; gap:14px;
}
.sdot { width:4px; height:4px; background:var(--p3); border-radius:50%; flex-shrink:0; }

/* ═══ SECTIONS ═══ */
.section { padding:clamp(44px,5vw,80px) 5%; }

.sec-header {
  display:grid; grid-template-columns:1fr 1fr;
  gap:clamp(24px,5vw,60px); align-items:end;
  padding-bottom:clamp(20px,3vw,32px);
  margin-bottom:clamp(20px,3vw,32px);
  border-bottom:1px solid var(--border);
}
.sec-label {
  font-size:0.7rem; font-weight:600; letter-spacing:3px;
  text-transform:uppercase; color:var(--p3); margin-bottom:14px;
}
h2 {
  font-family:'Playfair Display',Georgia,serif;
  font-size:clamp(2rem,5vw,4.5rem);
  font-weight:700; line-height:1.05; color:var(--dark);
}
.sec-sub {
  font-size:clamp(0.95rem,1.8vw,1.15rem);
  color:var(--muted); line-height:1.85; align-self:end;
}

/* ═══ PAIN SECTION ═══ */
.pain-bg { background:var(--white); }
.pain-intro-box {
  background:var(--bg);
  border:1px solid var(--border);
  padding:clamp(20px,3vw,32px) clamp(20px,3vw,36px);
  margin-bottom:clamp(16px,2vw,24px);
}
.pain-intro-box p {
  font-size:clamp(1rem,2vw,1.2rem);
  color:var(--muted); line-height:1.9; margin-bottom:16px;
}
.pain-intro-box p:last-child { margin-bottom:0; }
.pain-highlight {
  background:var(--p1);
  border-left:4px solid var(--p3);
  padding:18px 24px;
  font-size:clamp(1rem,1.8vw,1.15rem);
  font-weight:500; color:var(--dark); line-height:1.65;
  margin:16px 0;
}
.pain-cards {
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:0; border:1px solid var(--border);
}
.pain-card {
  padding:clamp(24px,3vw,36px) clamp(20px,3vw,32px);
  border-right:1px solid var(--border);
  background:var(--white); transition:background 0.3s;
}
.pain-card:last-child { border-right:none; }
.pain-card:hover { background:var(--p4); }
.pain-card-title {
  font-family:'Playfair Display',Georgia,serif;
  font-size:clamp(1.05rem,1.8vw,1.2rem);
  font-weight:600; color:var(--dark); margin-bottom:10px;
}
.pain-card p { font-size:clamp(0.88rem,1.5vw,1rem); color:var(--muted); line-height:1.75; }

/* ═══ PRICING ═══ */
.pricing-bg { background:var(--dark); }
.pricing-bg .sec-label { color:var(--p2); }
.pricing-bg h2 { color:var(--white); }
.pricing-bg .sec-sub { color:var(--muted); }
.pricing-bg .sec-header { border-color:rgba(255,255,255,0.08); }

.pricing-grid {
  display:grid; grid-template-columns:repeat(4,1fr);
  border:1px solid rgba(255,255,255,0.1);
}
.card {
  padding:clamp(32px,3vw,52px) clamp(20px,2.5vw,36px);
  border-right:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.04);
  position:relative; transition:background 0.3s, transform 0.3s ease;
  transform-style:preserve-3d;
}
.card:last-child { border-right:none; }
.card:hover { background:rgba(255,255,255,0.07); }
.card.featured { background:var(--white); }
.card.featured * { color:var(--dark) !important; }
.card.featured .card-name { color:var(--p3) !important; }
.card.featured .feat::before { background:var(--p3) !important; }
.card.featured .card-divider { background:var(--border) !important; }
.card.featured .c-btn { background:var(--dark); color:var(--white) !important; border:none; }
.card.featured .c-btn:hover { background:var(--mid); }

.best-tag {
  position:absolute; top:0; left:0; right:0;
  background:var(--p3); color:var(--dark);
  text-align:center; font-size:0.68rem;
  font-weight:700; letter-spacing:2px;
  text-transform:uppercase; padding:9px;
}
.card-name {
  font-size:0.7rem; font-weight:600; letter-spacing:3px;
  text-transform:uppercase; color:var(--p2);
  margin-bottom:18px;
}
.card-price {
  font-family:'Playfair Display',Georgia,serif;
  font-size:clamp(3.5rem,5vw,6rem);
  font-weight:900; color:var(--white);
  line-height:1; margin-bottom:4px;
}
.card-price sup { font-size:1.8rem; vertical-align:super; }
.card-price sup.cents { font-size:1.4rem; }
.card-price-old {
  font-family:'Playfair Display',Georgia,serif;
  font-size:clamp(1.4rem,2vw,1.8rem);
  color:var(--muted);
  text-decoration:line-through;
  text-decoration-color:rgba(234,80,80,0.7);
  text-decoration-thickness:2px;
  line-height:1; margin-bottom:2px;
  opacity:0.65;
}
.card-price-old sup { font-size:0.9rem; vertical-align:super; }
.card.featured .card-price-old { color:var(--muted) !important; }
.card-period { font-size:0.85rem; color:var(--muted); margin-bottom:14px; }
.card-divider { height:1px; background:rgba(255,255,255,0.1); margin:20px 0; }
.card-desc { font-size:clamp(0.88rem,1.5vw,1rem); color:var(--muted); line-height:1.7; margin-bottom:20px; }
.feats { list-style:none; margin-bottom:clamp(24px,3vw,40px); }
.feat {
  display:flex; align-items:center; gap:12px;
  font-size:clamp(0.88rem,1.5vw,1rem);
  color:rgba(255,255,255,0.85);
  padding:clamp(8px,1.5vw,12px) 0;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.feat:last-child { border-bottom:none; }
.feat::before {
  content:''; width:5px; height:5px;
  border-radius:50%; background:var(--p2); flex-shrink:0;
}
.c-btn {
  display:block; text-align:center;
  padding:clamp(12px,2vw,16px);
  font-size:clamp(0.88rem,1.5vw,0.95rem);
  font-weight:600; text-decoration:none;
  border:1px solid rgba(255,255,255,0.2);
  color:var(--white); transition:all 0.25s;
  font-family:'Outfit',sans-serif;
}
.c-btn:hover { background:rgba(255,255,255,0.08); }
.pricing-note {
  text-align:center; margin-top:clamp(20px,3vw,36px);
  font-size:clamp(0.85rem,1.5vw,0.95rem); color:var(--muted);
}
.pricing-note a { color:var(--p2); text-decoration:none; font-weight:500; }

/* ═══ PROCESS ═══ */
.process-bg { background:var(--white); }
.steps {
  display:grid; grid-template-columns:repeat(4,1fr);
  border:1px solid var(--border);
}
.step {
  padding:clamp(32px,4vw,56px) clamp(20px,3vw,40px);
  border-right:1px solid var(--border);
  transition:background 0.3s;
}
.step:last-child { border-right:none; }
.step:hover { background:var(--p4); }
.step-n {
  font-family:'Playfair Display',Georgia,serif;
  font-size:clamp(3rem,5vw,5rem);
  font-weight:900; color:var(--p1); line-height:1; margin-bottom:20px;
}
.step h3 {
  font-family:'Playfair Display',Georgia,serif;
  font-size:clamp(1.1rem,2vw,1.5rem);
  font-weight:400; color:var(--dark); margin-bottom:12px;
}
.step p { font-size:clamp(0.88rem,1.5vw,1rem); color:var(--muted); line-height:1.75; }

/* ═══ GUARANTEE ═══ */
.guarantee { display:grid; grid-template-columns:1fr 1fr; }
.guar-l {
  background:#e4f2f0; padding:clamp(60px,8vw,100px) 6%;
  display:flex; flex-direction:column; justify-content:center;
}
.guar-l h2 {
  font-size:clamp(2rem,4vw,4.5rem);
  margin-bottom:20px;
}
.guar-l p { font-size:clamp(1rem,1.8vw,1.2rem); color:var(--mid); line-height:1.9; margin-bottom:36px; }
.guar-r {
  background:var(--white); padding:clamp(60px,8vw,100px) 6%;
  border-left:1px solid var(--border);
  display:flex; flex-direction:column; justify-content:center;
}
.guar-item {
  padding:clamp(20px,3vw,32px) 0;
  border-bottom:1px solid var(--border);
  display:flex; gap:20px; align-items:flex-start;
}
.guar-item:last-child { border-bottom:none; }
.guar-num {
  font-family:'Playfair Display',Georgia,serif;
  font-size:1.8rem; font-weight:700; color:var(--p2);
  flex-shrink:0; width:36px; line-height:1;
}
.guar-text h3 { font-size:clamp(1rem,1.8vw,1.2rem); font-weight:600; color:var(--dark); margin-bottom:8px; }
.guar-text p { font-size:clamp(0.88rem,1.5vw,1rem); color:var(--muted); line-height:1.8; }

/* ═══ CTA ═══ */
.cta { background:var(--dark); display:grid; grid-template-columns:1fr 1fr; }
.cta-l {
  padding:clamp(60px,8vw,100px) 6%;
  display:flex; flex-direction:column; justify-content:center;
  border-right:1px solid rgba(255,255,255,0.08);
}
.cta-l .sec-label { color:var(--p2); }
.cta-l h2 { color:var(--white); font-size:clamp(2.2rem,4vw,5rem); margin-bottom:20px; }
.cta-l h2 em { color:var(--p2); font-style:italic; }
.cta-l p { font-size:clamp(1rem,1.8vw,1.2rem); color:var(--muted); line-height:1.85; margin-bottom:40px; }
.btn-light {
  display:inline-block; background:var(--p2); color:var(--dark);
  padding:clamp(14px,2vw,18px) clamp(28px,4vw,44px);
  font-size:clamp(0.95rem,1.8vw,1.1rem); font-weight:600;
  text-decoration:none; transition:all 0.25s;
  font-family:'Outfit',sans-serif; width:fit-content;
}
.btn-light:hover { background:var(--p1); }
.cta-r {
  padding:clamp(60px,8vw,100px) 6%;
  display:flex; flex-direction:column; justify-content:center; gap:14px;
}
.pkg {
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  padding:clamp(20px,2.5vw,28px) clamp(20px,3vw,32px);
  display:flex; align-items:center; justify-content:space-between;
  text-decoration:none; transition:all 0.25s;
}
.pkg:hover { background:rgba(255,255,255,0.1); border-color:var(--p2); }
.pkg-name { font-family:'Playfair Display',Georgia,serif; font-size:clamp(1.1rem,2vw,1.4rem); color:var(--white); }
.pkg-desc { font-size:clamp(0.8rem,1.3vw,0.9rem); color:var(--muted); margin-top:4px; }
.pkg-r { display:flex; align-items:center; gap:14px; }
.pkg-price { font-family:'Playfair Display',Georgia,serif; font-size:clamp(1.4rem,2.5vw,2rem); font-weight:700; color:var(--p2); }
.pkg-price-old { font-family:'Playfair Display',Georgia,serif; font-size:clamp(0.9rem,1.5vw,1.1rem); color:var(--muted); text-decoration:line-through; text-decoration-color:rgba(234,80,80,0.6); text-decoration-thickness:1.5px; opacity:0.6; margin-right:4px; }
.pkg-arrow { color:var(--p3); font-size:1.2rem; }

/* ═══ FOOTER ═══ */
footer {
  background:var(--white); border-top:1px solid var(--border);
  display:grid; grid-template-columns:1.5fr 1fr 1fr;
}
.f-col { padding:clamp(28px,4vw,44px) 5%; border-right:1px solid var(--border); }
.f-col:last-child { border-right:none; }
.f-logo { font-family:'Playfair Display',Georgia,serif; font-size:1.2rem; color:var(--dark); margin-bottom:10px; }
footer p { font-size:clamp(0.85rem,1.5vw,0.95rem); color:var(--muted); line-height:1.7; }
.f-links { display:flex; flex-direction:column; gap:10px; }
.f-links a { color:var(--muted); text-decoration:none; font-size:clamp(0.88rem,1.5vw,1rem); transition:color 0.2s; }
.f-links a:hover { color:var(--mid); }

/* ═══ PORTFOLIO ═══ */
.portfolio-bg { background:var(--bg); }

.port-stats {
  display:grid; grid-template-columns:repeat(3,1fr);
  border:1px solid var(--border);
  background:var(--white);
  margin-bottom:clamp(28px,4vw,44px);
  max-width:720px;
  margin-left:auto;
  margin-right:auto;
}
.pstat {
  padding:clamp(22px,3vw,34px) clamp(20px,3vw,32px);
  border-right:1px solid var(--border);
  text-align:left;
  transition:background 0.2s;
}
.pstat:last-child { border-right:none; }
.pstat:hover { background:var(--p4); }
.pstat-num {
  font-family:'Playfair Display',Georgia,serif;
  font-size:clamp(2rem,4vw,3.4rem);
  font-weight:900; color:var(--dark); line-height:1;
  margin-bottom:8px;
}
.pstat-label {
  font-size:0.7rem; font-weight:600; letter-spacing:2px;
  text-transform:uppercase; color:var(--p3);
}

.port-filters {
  display:flex; flex-wrap:wrap;
  margin-bottom:clamp(24px,3vw,36px);
  border:1px solid var(--border);
  background:var(--white);
  width:fit-content;
}
.pfilter {
  background:transparent; border:none;
  border-right:1px solid var(--border);
  padding:13px 24px;
  font-family:'Outfit',sans-serif;
  font-size:0.78rem; font-weight:500;
  letter-spacing:1.5px; text-transform:uppercase;
  color:var(--muted); cursor:pointer;
  transition:all 0.2s;
}
.pfilter:last-child { border-right:none; }
.pfilter:hover { background:var(--p4); color:var(--dark); }
.pfilter.active { background:var(--dark); color:var(--white); }

.port-grid {
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:clamp(14px,2vw,22px);
  max-width:720px;
  margin:0 auto;
}

.clip {
  background:var(--white);
  border:1px solid var(--border);
  display:flex; flex-direction:column;
  transition:transform 0.4s ease, box-shadow 0.4s ease;
  cursor:pointer;
}
.clip:hover {
  transform:translateY(-4px);
  box-shadow:0 18px 44px rgba(15,46,43,0.10);
}

.clip-frame {
  position:relative;
  aspect-ratio:9/16;
  overflow:hidden;
  background:var(--dark);
}
.clip-bg {
  position:absolute; inset:0; z-index:1;
}
.clip-img {
  position:absolute; inset:0; z-index:5;
  width:100%; height:100%;
  object-fit:cover;
  display:block;
}
.clip-bg::before {
  content:''; position:absolute; inset:0;
  background:
    radial-gradient(circle at 20% 25%, rgba(255,255,255,0.18) 0%, transparent 45%),
    radial-gradient(circle at 80% 75%, rgba(255,255,255,0.10) 0%, transparent 45%);
}
.clip-bg::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,0.15) 0%, transparent 30%, transparent 55%, rgba(0,0,0,0.78) 100%);
}

/* Per-clip gradients — each unique */
.clip-1 .clip-bg { background:linear-gradient(135deg, #1a1a2e 0%, #533483 50%, #e94560 100%); }
.clip-2 .clip-bg { background:linear-gradient(135deg, #f4a261 0%, #e76f51 60%, #6d597a 100%); }
.clip-3 .clip-bg { background:linear-gradient(140deg, #355c3a 0%, #6a994e 55%, #a7c957 100%); }

.clip-hud {
  position:absolute; inset:0; z-index:3;
  display:flex; flex-direction:column;
  justify-content:space-between;
  padding:13px;
}
.clip-top {
  display:flex; justify-content:space-between;
  align-items:flex-start; gap:8px;
}
.clip-platform {
  background:rgba(255,255,255,0.16);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  color:#fff;
  font-size:0.6rem; font-weight:700;
  letter-spacing:1.8px; text-transform:uppercase;
  padding:5px 9px;
  border:1px solid rgba(255,255,255,0.22);
}
.clip-time {
  background:rgba(0,0,0,0.5);
  color:#fff;
  font-size:0.7rem; font-weight:500;
  font-variant-numeric:tabular-nums;
  padding:3px 7px;
}

.clip-play {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:54px; height:54px; border-radius:50%;
  background:rgba(255,255,255,0.95);
  z-index:4;
  display:flex; align-items:center; justify-content:center;
  transition:transform 0.3s ease;
  box-shadow:0 6px 24px rgba(0,0,0,0.25);
}
.clip:hover .clip-play { transform:translate(-50%,-50%) scale(1.12); }
.clip-play::after {
  content:''; width:0; height:0;
  border-left:15px solid var(--dark);
  border-top:9px solid transparent;
  border-bottom:9px solid transparent;
  margin-left:4px;
}

.clip-bottom { color:#fff; }
.clip-caption {
  font-family:'Playfair Display',Georgia,serif;
  font-weight:500;
  font-size:clamp(0.92rem,1.5vw,1.1rem);
  line-height:1.3; margin-bottom:9px;
  text-shadow:0 2px 14px rgba(0,0,0,0.55);
}
.clip-meta {
  display:flex; gap:14px;
  font-size:0.74rem; font-weight:500;
  color:rgba(255,255,255,0.95);
  font-variant-numeric:tabular-nums;
}
.clip-meta span { display:flex; align-items:center; gap:5px; }
.clip-icon {
  display:inline-block; width:11px; height:11px;
  fill:rgba(255,255,255,0.95);
}

.clip-info {
  padding:16px 18px;
  border-top:1px solid var(--border);
  display:flex; justify-content:space-between;
  align-items:flex-end; gap:12px;
}
.clip-title {
  font-family:'Playfair Display',Georgia,serif;
  font-size:clamp(0.95rem,1.6vw,1.1rem);
  font-weight:600; color:var(--dark);
  margin-bottom:3px; line-height:1.25;
}
.clip-streamer {
  font-size:0.78rem; color:var(--muted);
  letter-spacing:0.3px;
}
.clip-cat {
  font-size:0.62rem; font-weight:600;
  letter-spacing:1.5px; text-transform:uppercase;
  color:var(--p3); white-space:nowrap;
  flex-shrink:0;
}

.port-cta {
  margin-top:clamp(28px,4vw,44px);
  padding:clamp(22px,3vw,32px);
  background:var(--white);
  border:1px solid var(--border);
  display:flex; align-items:center;
  justify-content:space-between;
  flex-wrap:wrap; gap:18px;
}
.port-cta-text {
  font-size:clamp(0.95rem,1.6vw,1.1rem);
  color:var(--dark); line-height:1.55;
  flex:1; min-width:240px;
}
.port-cta-text strong { font-weight:600; }
.port-cta-text span { color:var(--muted); }
.port-cta-btn {
  display:inline-block;
  background:var(--dark); color:var(--white);
  padding:14px 32px;
  font-size:0.95rem; font-weight:600;
  text-decoration:none;
  font-family:'Outfit',sans-serif;
  transition:background 0.25s;
  white-space:nowrap;
}
.port-cta-btn:hover { background:var(--mid); }

/* ═══ REVEAL ON SCROLL ═══ */
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold:0.06 });
document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

/* ═══ ANIMATED COUNTERS ═══ */
function animateCounter(el, target, suffix='') {
  const isFloat = String(target).includes('.');
  const duration = 1800;
  const start = performance.now();
  const tick = now => {
    const p = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1 - p, 3);
    const val = isFloat ? (target * ease).toFixed(1) : Math.floor(target * ease);
    el.textContent = val + suffix;
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
const counterObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting && !e.target.dataset.counted) {
      e.target.dataset.counted = '1';
      const text = e.target.textContent.trim();
      const num = parseFloat(text.replace(/[^0-9.]/g,''));
      const suffix = text.replace(/[0-9.,]/g,'');
      if (!isNaN(num)) animateCounter(e.target, num, suffix);
    }
  });
}, { threshold:0.5 });
document.querySelectorAll('.hstat-num, .pstat-num').forEach(el => counterObs.observe(el));

/* ═══ NAVBAR SCROLL EFFECT ═══ */
const nav = document.querySelector('nav');
let lastScroll = 0;
window.addEventListener('scroll', () => {
  const y = window.scrollY;
  if (y > 80) nav.style.boxShadow = '0 2px 24px rgba(15,46,43,0.08)';
  else nav.style.boxShadow = 'none';
  lastScroll = y;
}, {passive:true});

/* ═══ SMOOTH SCROLL ═══ */
document.querySelectorAll('a[href^="#"]').forEach(a => {
  a.addEventListener('click', e => {
    const t = document.querySelector(a.getAttribute('href'));
    if (t) { e.preventDefault(); t.scrollIntoView({behavior:'smooth',block:'start'}); }
  });
});

/* ═══ PRICING CARD TILT ═══ */
document.querySelectorAll('.card').forEach(card => {
  card.addEventListener('mousemove', e => {
    const r = card.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;
    const y = (e.clientY - r.top) / r.height - 0.5;
    card.style.transform = `perspective(600px) rotateY(${x*4}deg) rotateX(${-y*4}deg) scale(1.02)`;
  });
  card.addEventListener('mouseleave', () => {
    card.style.transform = 'perspective(600px) rotateY(0) rotateX(0) scale(1)';
  });
});

/* ═══ STAGGERED REVEALS ═══ */
document.querySelectorAll('.pricing-grid .card').forEach((c,i) => { c.style.transitionDelay = (i*0.1)+'s'; });
document.querySelectorAll('.steps .step').forEach((s,i) => { s.style.transitionDelay = (i*0.12)+'s'; });
document.querySelectorAll('.pain-cards .pain-card').forEach((p,i) => { p.style.transitionDelay = (i*0.1)+'s'; });
</script>
