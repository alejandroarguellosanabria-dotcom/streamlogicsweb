<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streamlogics — Clip Agency for Streamers</title>

<link rel="icon" type="image/png" href="streamlogics-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #e8f4f2;
  --white:  #ffffff;
  --p1:     #c2deda;
  --p2:     #9ecdc8;
  --p3:     #6ab0a8;
  --p4:     #d8eeed;
  --dark:   #0f2e2b;
  --mid:    #1e5c56;
  --muted:  #5a8c87;
  --border: #b0d4cf;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
body {
  background:var(--bg);
  color:var(--dark);
  font-family:'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight:300;
  overflow-x:hidden;
  line-height:1.5;
}

/* ═══ NAV ═══ */
nav {
  position:fixed; top:0; left:0; right:0; z-index:100;
  background:var(--white);
  border-bottom:1px solid var(--border);
  height:64px;
  display:flex; align-items:center;
  justify-content:space-between;
  padding:0 5%;
}
.logo {
  font-family:'Playfair Display', Georgia, serif;
  font-size:1.25rem; font-weight:400; color:var(--dark);
  letter-spacing:0.5px;
}
.nav-links {
  display:flex; align-items:center; gap:0;
}
.nav-links a {
  padding:0 20px; height:64px;
  display:flex; align-items:center;
  color:var(--muted); text-decoration:none;
  font-size:0.88rem; font-weight:400;
  border-left:1px solid var(--border);
  transition:all 0.2s;
  white-space:nowrap;
}
.nav-links a:hover { background:var(--p4); color:var(--dark); }
.nav-links .nav-cta {
  background:var(--dark); color:var(--white) !important;
  font-weight:600;
}
.nav-links .nav-cta:hover { background:var(--mid) !important; }
.nav-mobile-cta {
  display:none;
  background:var(--dark); color:var(--white);
  padding:10px 20px; font-size:0.88rem; font-weight:600;
  text-decoration:none; font-family:'Outfit',sans-serif;
  white-space:nowrap;
}

/* ═══ HERO ═══ */
.hero {
  min-height:100svh;
  padding:100px 5% 60px;
  background:var(--bg);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  text-align:center;
}

.hero-badge {
  display:inline-flex; align-items:center; gap:8px;
  background:rgba(255,255,255,0.8);
  border:1px solid var(--border);
  padding:8px 18px; margin-bottom:36px;
  font-size:0.72rem; font-weight:600;
  letter-spacing:2.5px; text-transform:uppercase;
  color:var(--mid);
}
.badge-dot {
  width:6px; height:6px; border-radius:50%;
  background:var(--p3);
  animation:blink 2s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

h1 {
  font-family:'Playfair Display', Georgia, serif;
  font-size:clamp(2.8rem, 8vw, 7rem);
  font-weight:700; line-height:1.08;
  color:var(--dark); margin-bottom:24px;
  max-width:800px; letter-spacing:-0.5px;
}
h1 em { font-style:italic; color:var(--p3); }

.hero-sub {
  font-size:clamp(1rem, 2.5vw, 1.35rem);
  color:var(--muted); line-height:1.85;
  max-width:520px; margin:0 auto 40px;
}

.hero-btn {
  display:inline-block;
  background:var(--dark); color:var(--white);
  padding:clamp(16px,3vw,22px) clamp(36px,6vw,64px);
  font-size:clamp(1rem,2.5vw,1.3rem);
  font-weight:600; text-decoration:none;
  font-family:'Outfit',sans-serif;
  transition:background 0.25s;
  margin-bottom:32px;
}
.hero-btn:hover { background:var(--mid); }

.proof {
  display:flex; align-items:center; gap:10px;
  justify-content:center;
  font-size:0.85rem; color:var(--muted);
  margin-bottom:52px;
}
.proof-avatars { display:flex; }
.proof-avatar {
  width:28px; height:28px; border-radius:50%;
  background:var(--p2); border:2px solid var(--bg);
  display:flex; align-items:center; justify-content:center;
  font-size:0.6rem; font-weight:600; color:var(--dark);
  margin-left:-7px;
}
.proof-avatar:first-child { margin-left:0; }

.hero-stats {
  width:100%; max-width:900px;
  display:grid; grid-template-columns:repeat(4,1fr);
  border:1px solid var(--border);
  background:var(--white);
}
.hstat {
  padding:clamp(20px,3vw,32px) clamp(16px,3vw,36px);
  border-right:1px solid var(--border);
  text-align:left;
  transition:background 0.2s;
}
.hstat:last-child { border-right:none; }
.hstat:hover { background:var(--p4); }
.hstat-label {
  font-size:0.68rem; font-weight:600; letter-spacing:2px;
  text-transform:uppercase; color:var(--p3); margin-bottom:6px;
}
.hstat-num {
  font-family:'Playfair Display',Georgia,serif;
  font-size:clamp(1.6rem,3vw,2.6rem);
  font-weight:900; color:var(--dark); line-height:1;
  margin-bottom:6px;
}
.hstat-desc { font-size:clamp(0.72rem,1.2vw,0.85rem); color:var(--muted); line-height:1.4; }

/* ═══ STRIP ═══ */
.strip {
  background:var(--dark); overflow:hidden;
  padding:0; border-top:1px solid rgba(255,255,255,0.06);
}
.strip-track {
  display:flex; width:max-content;
  animation:marquee 24s linear infinite;
}
@keyframes marquee { from{transform:translateX(0)} to{transform:translateX(-50%)} }
.strip-item {
  padding:14px 40px;
  font-size:0.78rem; font-weight:500;
  letter-spacing:2px; text-transform:uppercase;
  color:var(--p2); white-space:nowrap;
  border-right:1px solid rgba(255,255,255,0.08);
  display:flex; align-items:center; gap:14px;
}
.sdot { width:4px; height:4px; background:var(--p3); border-radius:50%; flex-shrink:0; }

/* ═══ SECTIONS ═══ */
.section { padding:clamp(44px,5vw,80px) 5%; }

.sec-header {
  display:grid; grid-template-columns:1fr 1fr;
  gap:clamp(24px,5vw,60px); align-items:end;
  padding-bottom:clamp(20px,3vw,32px);
  margin-bottom:clamp(20px,3vw,32px);
  border-bottom:1px solid var(--border);
}
.sec-label {
  font-size:0.7rem; font-weight:600; letter-spacing:3px;
  text-transform:uppercase; color:var(--p3); margin-bottom:14px;
}
h2 {
  font-family:'Playfair Display',Georgia,serif;
  font-size:clamp(2rem,5vw,4.5rem);
  font-weight:700; line-height:1.05; color:var(--dark);
}
.sec-sub {
  font-size:clamp(0.95rem,1.8vw,1.15rem);
  color:var(--muted); line-height:1.85; align-self:end;
}

/* ═══ PAIN SECTION ═══ */
.pain-bg { background:var(--white); }
.pain-intro-box {
  background:var(--bg);
  border:1px solid var(--border);
  padding:clamp(20px,3vw,32px) clamp(20px,3vw,36px);
  margin-bottom:clamp(16px,2vw,24px);
}
.pain-intro-box p {
  font-size:clamp(1rem,2vw,1.2rem);
  color:var(--muted); line-height:1.9; margin-bottom:16px;
}
.pain-intro-box p:last-child { margin-bottom:0; }
.pain-highlight {
  background:var(--p1);
  border-left:4px solid var(--p3);
  padding:18px 24px;
  font-size:clamp(1rem,1.8vw,1.15rem
